spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# KAFKA CONFIG
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer= org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer= org.springframework.kafka.support.serializer.JsonSerializer

# How many Kafka brokers must confirm a White before the producer considers the message "successfully sent".
# 0 No confirmation (fire-and-forget)
# 1 Leader broker confirms
# all in-sync replicas confirm
# DEFAULT : 1
spring.kafka.producer.acks= all

# How many times the producer will retry sending a message if it fails.
# DEFAULT : 0
spring.kafka.producer.retries= 3
