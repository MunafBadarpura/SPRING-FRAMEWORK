spring.application.name=notification-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# KAFKA CONSUMER CONFIG
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=${spring.application.name}

# Key & Value Deserializer for Kafka
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages = com.munaf.*


# From where the consumer should start reading if no committed offset exists.
# earliest:  Read from beginning of topic
# latest : Read only new messages
# none :Throw error if offset missing
# DEFAULT : latest
spring.kafka.consumer.auto-offset-reset=earliest

# Whether Kafka automatically commits offsets for you.
# false : You commit only after successful processing (prevent data loss)
# true : Kafka commit offsets even if processing fails (possible data loss)
# DEFAULT : true
spring.kafka.consumer.enable-auto-commit=false

# Maximum number of records returned in a single poll() call. (control memory usage, processing load)
# 100 messages -> process -> commit -> next poll
# DEFAULT : 500
spring.kafka.consumer.max-poll-records=100
