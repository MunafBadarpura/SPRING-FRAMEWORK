spring:
  application:
    name: A30_HELP_DESK_AI

  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GEMINI_PROJECT_ID}
          location: ${GEMINI_LOCATION}
          chat:
            options:
              model: gemini-2.5-flash
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: ALWAYS

  datasource:
      url: jdbc:postgresql://localhost:5432/helpdesk_ai
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

server:
  port: 8085
